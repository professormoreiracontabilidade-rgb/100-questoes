const DATA=[{"prova": "2024.1", "num": 11, "texto": "Desreconhecimento é a retirada de parte ou da totalidade de ativo ou passivo reconhecido do balanço patrimonial da entidade. O desreconhecimento normalmente ocorre quando esse item não atende mais à definição de ativo ou passivo, que expirou, foi consumido, recebido, executado ou transferido. A máquina utilizada para a produção do principal produto de uma determinada entidade deve ser desreconhecida quando (A) perder todo o potencial de produzir benefícios econômicos para a entidade. (B) estiver parcialmente depreciado. (C) sofrer perda de valor recuperável. (D) estiver sob controle da entidade. 4", "gabarito": "A", "comentario": "Gabarito: A. Comentário: desreconhecimento ocorre quando o item deixa de atender à definição de ativo ou passivo, normalmente por perda de controle, expiração, consumo, recebimento, execução ou transferência. A opção A é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "Desreconhecimento é a retirada de parte ou da totalidade de ativo ou passivo reconhecido do balanço patrimonial da entidade. O desreconhecimento normalmente ocorre quando esse item não atende mais à definição de ativo ou passivo, que expirou, foi consumido, recebido, executado ou transferido. A máquina utilizada para a produção do principal produto de uma determinada entidade deve ser desreconhecida quando\n(A) perder todo o potencial de produzir benefícios econômicos para a entidade.\n(B) estiver parcialmente depreciado.\n(C) sofrer perda de valor recuperável.\n(D) estiver sob controle da entidade. 4"}, {"prova": "2024.1", "num": 12, "texto": "Conforme a NBC TG – ESTRUTURA CONCEITUAL, uma Receita reflete aumento nos ativos, ou redução nos passivos, que resultam em aumentos no patrimônio líquido, exceto aqueles referentes a contribuições de detentores de direitos sobre o patrimônio. Avalie se são reconhecidos como Receita, nesse contexto, r distribuições para, e contribuições de, sócios durante o período, é a Manutenção do (A) Capital Físico. (B) Capital Financeiro. (C) Capital Social. (D) Capital Integralizado.", "gabarito": "B", "comentario": "Gabarito: B. Comentário: na manutenção do capital financeiro, o lucro existe quando os ativos líquidos finais superam os iniciais, excluídas contribuições e distribuições aos sócios. A opção B é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "O conceito de Capital é adotado pela maioria das entidades na elaboração das Demonstrações Contábeis. A seleção do conceito apropriado de Capital pela entidade deve ser baseada nas necessidades dos seus usuários, principalmente, os preocupados com a manutenção de capital nominal investido ou com o poder de compra do capital investido. A manutenção do Capital em que o lucro é auferido somente se o montante dos ativos líquidos no final do período exceder o montante dos ativos líquidos no início do período, após excluir quaisquer distribuições para, e contribuições de, sócios durante o período, é a Manutenção do\n(A) Capital Físico.\n(B) Capital Financeiro.\n(C) Capital Social.\n(D) Capital Integralizado."}, {"prova": "2024.1", "num": 14, "texto": "As demonstrações contábeis são normalmente elaboradas com base na suposição de que a entidade que reporta está em continuidade operacional. Desse modo, presume-se que a entidade não tem a intenção e nem a necessidade de (A) tornar-se internacional. (B) modificar a sua atividade-fim. (C) entrar em liquidação ou deixar de negociar. (D) expandir os seus negócios para outras localidades.", "gabarito": "C", "comentario": "Gabarito: C. Comentário: a continuidade operacional presume que a entidade seguirá operando, sem intenção ou necessidade de liquidação ou encerramento das atividades. A opção C é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "As demonstrações contábeis são normalmente elaboradas com base na suposição de que a entidade que reporta está em continuidade operacional. Desse modo, presume-se que a entidade não tem a intenção e nem a necessidade de\n(A) tornar-se internacional.\n(B) modificar a sua atividade-fim.\n(C) entrar em liquidação ou deixar de negociar.\n(D) expandir os seus negócios para outras localidades."}, {"prova": "2024.1", "num": 15, "texto": "Conforme a NBC TG 04 (R4) – ATIVO INTANGÍVEL, não são exemplos de gastos a serem reconhecidos como despesa aqueles incorridos com (A) atividades pré-operacionais destinadas a constituir a empresa. (B) treinamento do pessoal próprio. (C) publicidade e atividades promocionais. (D) o desenvolvimento de ativos intangíveis gerados internamente. 5", "gabarito": "D", "comentario": "Gabarito: D. Comentário: gastos de pesquisa, treinamento, publicidade e pré-operacionais tendem a ser despesa; desenvolvimento só pode ser ativado se atender aos critérios da norma. A opção D é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "Conforme a NBC TG 04 (R4) – ATIVO INTANGÍVEL, não são exemplos de gastos a serem reconhecidos como despesa aqueles incorridos com\n(A) atividades pré-operacionais destinadas a constituir a empresa.\n(B) treinamento do pessoal próprio.\n(C) publicidade e atividades promocionais.\n(D) o desenvolvimento de ativos intangíveis gerados internamente. 5"}, {"prova": "2024.1", "num": 16, "texto": "A Sociedade A possui 65% de ações com direito a voto sobre a Sociedade B, cujo Patrimônio Líquido equivale a R$2.000.000. Com essa participação a Sociedade A exerce o controle da sociedade B. Durante o exercício de 2023, a Sociedade “B” apresentou um lucro de R$200.000. Diante dos dados apresentados, e de acordo com a NBC TG 18 (R3) – INVESTIMENTO EM COLIGADA, em Controlada e em Empreendimento Controlado em Conjunto, a Sociedade A ef a foi julgado e o órgão fiscal determinou que a Sociedade Empresária recolhesse a quantia de R$6.000.000. A Sociedade Empresária optou por não recorrer da decisão. A elaboração das demonstrações contábeis foi finalizada pelo Departamento Contábil em 28/02/2024 e o Conselho de Administração autorizou a emissão de tais demonstrações em 25/03/2024. Instado a decidir se a Sociedade Empresária XXX deve ajustar as Demonstrações Contábeis de 2023 e por qual valor, você declara, corretamente, que a Sociedade Empresária XXX (A) deve ajustar as Demonstrações Contábeis de 2023, reduzindo o lucro do período e aumentando o passivo em R$1.000.000. (B) deve ajustar as Demonstrações Contábeis de 2023, reduzindo o lucro do período e aumentando o passivo em R$2.000.000. (C) não deve ajustar as Demonstrações Contábeis de 2023, sendo a determinação do órgão fiscal ocorrida depois de 31/12/2023. (D) não deve ajustar as Demonstrações Contábeis de 2023, sendo a determinação do órgão fiscal ocorrida depois da data de finalização das Demonstrações Contábeis por parte do Departamento Contábil.", "gabarito": "A", "comentario": "Gabarito: A. Comentário: provisões exigem obrigação presente, saída provável de recursos e estimativa confiável; eventos subsequentes podem ajustar valores se confirmarem condição existente. A opção A é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "No ano de 2023, a Sociedade Empresária XXX foi autuada por um órgão fiscal que alegava o não recolhimento de determinado imposto no valor de R$7.000.000. Com base na análise de seu departamento jurídico, a Sociedade Empresária constituiu uma provisão no valor de R$5.000.000 nas demonstrações de 2023 e impetrou recurso administrativo ao referido órgão. Em 15/03/2024, o recurso da Sociedade Empresária foi julgado e o órgão fiscal determinou que a Sociedade Empresária recolhesse a quantia de R$6.000.000. A Sociedade Empresária optou por não recorrer da decisão. A elaboração das demonstrações contábeis foi finalizada pelo Departamento Contábil em 28/02/2024 e o Conselho de Administração autorizou a emissão de tais demonstrações em 25/03/2024. Instado a decidir se a Sociedade Empresária XXX deve ajustar as Demonstrações Contábeis de 2023 e por qual valor, você declara, corretamente, que a Sociedade Empresária XXX\n(A) deve ajustar as Demonstrações Contábeis de 2023, reduzindo o lucro do período e aumentando o passivo em R$1.000.000.\n(B) deve ajustar as Demonstrações Contábeis de 2023, reduzindo o lucro do período e aumentando o passivo em R$2.000.000.\n(C) não deve ajustar as Demonstrações Contábeis de 2023, sendo a determinação do órgão fiscal ocorrida depois de 31/12/2023.\n(D) não deve ajustar as Demonstrações Contábeis de 2023, sendo a determinação do órgão fiscal ocorrida depois da data de finalização das Demonstrações Contábeis por parte do Departamento Contábil."}, {"prova": "2024.1", "num": 19, "texto": "Em 31/12/2022, uma companhia tinha seu capital social dividido em 40.000 ações ordinárias (ON). Naquela data, todas estavam em poder dos acionistas. As seguintes operações com ações foram registradas durante o exercício de 2023: Data Operação 30/04/2023 Emissão de 1.000 novas ações ON, imediatamente subscritas e integralizadas pelos acionistas. 30/09/2023 Recompra de 2.000 ações, mantidas em tesouraria. 30/11/2023 Venda de 1.000 ações que estavam em tesouraria. Ao final do exercício de 2023, a companhia apurou Lucro Líquido de R$202.110. Os valores do Resultado Básico por ação e do Resultado Diluído por ação, a serem divulgados pela companhia, são, respectivamente, (A) 5,05275 e 5,02137. (B) 5,02137 e 5,02137. (C) 5,05275 e 4,92951. (D) 5,05275 e 5,0275. 6", "gabarito": "B", "comentario": "Gabarito: B. Comentário: na manutenção do capital financeiro, o lucro existe quando os ativos líquidos finais superam os iniciais, excluídas contribuições e distribuições aos sócios. A opção B é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "Em 31/12/2022, uma companhia tinha seu capital social dividido em 40.000 ações ordinárias (ON). Naquela data, todas estavam em poder dos acionistas. As seguintes operações com ações foram registradas durante o exercício de 2023: Data Operação 30/04/2023 Emissão de 1.000 novas ações ON, imediatamente subscritas e integralizadas pelos acionistas. 30/09/2023 Recompra de 2.000 ações, mantidas em tesouraria. 30/11/2023 Venda de 1.000 ações que estavam em tesouraria. Ao final do exercício de 2023, a companhia apurou Lucro Líquido de R$202.110. Os valores do Resultado Básico por ação e do Resultado Diluído por ação, a serem divulgados pela companhia, são, respectivamente,\n(A) 5,05275 e 5,02137.\n(B) 5,02137 e 5,02137.\n(C) 5,05275 e 4,92951.\n(D) 5,05275 e 5,0275. 6"}, {"prova": "2024.1", "num": 20, "texto": "A Sociedade Empresária A possui estoque de um mix de mercadorias para revenda e deseja mensurar as mercadorias da categoria b de acordo com a NORMA BRASILEIRA DE CONTABILIDADE NBC TG 16 (R2) – ESTOQUES. Em termos unitários, o valor de custo das mercadorias dessa categoria é de R$20; o valor realizável líquido é de R$15 e o preço de venda é de R$30. Considerando a quantidade de mil unidades, o seguinte valor dessas mercadorias deve ser apresentado no balanço patrimonial: (A) R$15. (B) R$15.000. (C) R$20.000. (D) R$30.000.", "gabarito": "B", "comentario": "Gabarito: B. Comentário: estoques são mensurados pelo menor valor entre o custo e o valor realizável líquido. A opção B é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "A Sociedade Empresária A possui estoque de um mix de mercadorias para revenda e deseja mensurar as mercadorias da categoria b de acordo com a NORMA BRASILEIRA DE CONTABILIDADE NBC TG 16 (R2) – ESTOQUES. Em termos unitários, o valor de custo das mercadorias dessa categoria é de R$20; o valor realizável líquido é de R$15 e o preço de venda é de R$30. Considerando a quantidade de mil unidades, o seguinte valor dessas mercadorias deve ser apresentado no balanço patrimonial:\n(A) R$15.\n(B) R$15.000.\n(C) R$20.000.\n(D) R$30.000."}, {"prova": "2024.1", "num": 21, "texto": "Em janeiro de 2024, uma companhia aérea anunciou uma promoção especial de Dia das Mães e vendeu, em fevereiro, 200 passagens aéreas do Rio de Janeiro para Porto Alegre, por R$300 cada, recebidos à vista. Em maio de 2024, os aeroportos de Porto Alegre foram fechados, de modo que a companhia aérea comunicou aos clientes que as passagens poderiam ser utilizadas em junho, sem pagamento de taxas e penalidades. Suponha que todos os clientes viajem em junho de 2024. Nesse caso, de acordo com a NBC TG 47 – Receita de Contratos com Clientes, a receita da companhia aérea relativa à venda das 200 passagens deve ser reconhecida no mês de (A) janeiro. (B) fevereiro. (C) maio. (D) junho.", "gabarito": "D", "comentario": "Gabarito: D. Comentário: receita aumenta ativos ou reduz passivos, elevando o patrimônio líquido, sem decorrer de contribuição dos sócios. A opção D é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "Em janeiro de 2024, uma companhia aérea anunciou uma promoção especial de Dia das Mães e vendeu, em fevereiro, 200 passagens aéreas do Rio de Janeiro para Porto Alegre, por R$300 cada, recebidos à vista. Em maio de 2024, os aeroportos de Porto Alegre foram fechados, de modo que a companhia aérea comunicou aos clientes que as passagens poderiam ser utilizadas em junho, sem pagamento de taxas e penalidades. Suponha que todos os clientes viajem em junho de 2024. Nesse caso, de acordo com a NBC TG 47 – Receita de Contratos com Clientes, a receita da companhia aérea relativa à venda das 200 passagens deve ser reconhecida no mês de\n(A) janeiro.\n(B) fevereiro.\n(C) maio.\n(D) junho."}, {"prova": "2024.1", "num": 22, "texto": "Em 01/07/2021, uma loja de roupas adquiriu uma máquina de costura por R$840. Na data, estimou que iria usar a máquina durante 4 anos e vendê-la pelo equivalente à vista de R$200 após esse período. Em 01/01/2023, a loja constatou que poderia utilizar a máquina por mais 3 anos, a partir dessa data, mas seu valor residual seria zero. Assinale a opção que indica o valor contábil da máquina de costura em 31/12/2023, conforme a NBC TG 27 – Ativo Imobilizado. (A) R$400. (B) R$440. (C) R$320. (D) R$210.", "gabarito": "A", "comentario": "Gabarito: A. Comentário: ativo imobilizado é bem tangível mantido para uso na produção, prestação de serviços, aluguel a terceiros ou administração, com expectativa de uso por mais de um período. A opção A é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "Em 01/07/2021, uma loja de roupas adquiriu uma máquina de costura por R$840. Na data, estimou que iria usar a máquina durante 4 anos e vendê-la pelo equivalente à vista de R$200 após esse período. Em 01/01/2023, a loja constatou que poderia utilizar a máquina por mais 3 anos, a partir dessa data, mas seu valor residual seria zero. Assinale a opção que indica o valor contábil da máquina de costura em 31/12/2023, conforme a NBC TG 27 – Ativo Imobilizado.\n(A) R$400.\n(B) R$440.\n(C) R$320.\n(D) R$210."}, {"prova": "2024.1", "num": 23, "texto": "Em 01/01/2022, uma fábrica de cosméticos adquiriu, por R$180.000, um terreno para a construção de um estacionamento para seus empregados. Em 31/12/2022, a fábrica realizou o teste de recuperabilidade desse terreno e constatou que seu valor em uso era de R$170.000, enquanto o seu valor justo era de R$190.000. Para vender o terreno, a fábrica deveria incorrer em despesas legais de alienação no valor de R$15.000. Assinale o valor do terreno no balanço patrimonial da fábrica após o teste de recuperabilidade, conforme a NBC TG 01 – REDUÇÃO AO VALOR RECUPERÁVEL DE ATIVOS. (A) R$170.000. (B) R$175.000. (C) R$180.000. (D) R$190.000.", "gabarito": "B", "comentario": "Gabarito: B. Comentário: valor justo é preço de saída na venda de ativo ou transferência de passivo em transação ordenada; custos de transação não reduzem o valor justo. A opção B é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "Em 01/01/2022, uma fábrica de cosméticos adquiriu, por R$180.000, um terreno para a construção de um estacionamento para seus empregados. Em 31/12/2022, a fábrica realizou o teste de recuperabilidade desse terreno e constatou que seu valor em uso era de R$170.000, enquanto o seu valor justo era de R$190.000. Para vender o terreno, a fábrica deveria incorrer em despesas legais de alienação no valor de R$15.000. Assinale o valor do terreno no balanço patrimonial da fábrica após o teste de recuperabilidade, conforme a NBC TG 01 – REDUÇÃO AO VALOR RECUPERÁVEL DE ATIVOS.\n(A) R$170.000.\n(B) R$175.000.\n(C) R$180.000.\n(D) R$190.000."}, {"prova": "2024.1", "num": 24, "texto": "De acordo com a Lei no 6.404/76, em uma sociedade empresária, as Reservas de Capital poderão ser utilizadas para absorver prejuízos quando (A) não houver ações em tesouraria. (B) estes estiverem acumulados há no mínimo três exercícios sociais. (C) estes ultrapassarem os lucros acumulados e as reservas de lucros. (D) houver garantia de que os dividendos mínimos obrigatórios serão pagos em conformidade. 7", "gabarito": "C", "comentario": "Gabarito: C. Comentário: na manutenção do capital financeiro, o lucro existe quando os ativos líquidos finais superam os iniciais, excluídas contribuições e distribuições aos sócios. A opção C é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "De acordo com a Lei no 6.404/76, em uma sociedade empresária, as Reservas de Capital poderão ser utilizadas para absorver prejuízos quando\n(A) não houver ações em tesouraria.\n(B) estes estiverem acumulados há no mínimo três exercícios sociais.\n(C) estes ultrapassarem os lucros acumulados e as reservas de lucros.\n(D) houver garantia de que os dividendos mínimos obrigatórios serão pagos em conformidade. 7"}, {"prova": "2024.1", "num": 25, "texto": "Em dezembro de 2023, uma empresa de consultoria comprou, à vista, aparelhos de ar condicionado, para o seu escritório, por R$6.000. Na data, pagou o frete no valor de R$200 e a instalação no valor de R$2.000. Os caixas consumidos, reconhecidos na Demonstração dos Fluxos de Caixa da empresa, elaborada pelo método direto, pelas atividades operacional e de investimento, de acordo com a NBCTG 03 (R3) – DEMONSTRAÇÕES DOS FLUXOS DE CAIXA, ATIVIDADES DE INVESTIMENTOS, são, respectivamente: (A) zero e R$8.200. (B) R$200 e R$8.000. (C) R$2.000 e R$6.200. (D) R$2.200 e R$6.000.", "gabarito": "A", "comentario": "Gabarito: A. Comentário: na DFC, compra ou venda de imobilizado é atividade de investimento; recebimentos e pagamentos ligados à atividade principal são operacionais. A opção A é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "Em dezembro de 2023, uma empresa de consultoria comprou, à vista, aparelhos de ar condicionado, para o seu escritório, por R$6.000. Na data, pagou o frete no valor de R$200 e a instalação no valor de R$2.000. Os caixas consumidos, reconhecidos na Demonstração dos Fluxos de Caixa da empresa, elaborada pelo método direto, pelas atividades operacional e de investimento, de acordo com a NBCTG 03 (R3) – DEMONSTRAÇÕES DOS FLUXOS DE CAIXA, ATIVIDADES DE INVESTIMENTOS, são, respectivamente:\n(A) zero e R$8.200.\n(B) R$200 e R$8.000.\n(C) R$2.000 e R$6.200.\n(D) R$2.200 e R$6.000."}, {"prova": "2024.1", "num": 26, "texto": "Uma joalheria reconheceu as seguintes receitas em 2023 com: • vendas de mercadorias: R$800.000; • financeira: R$400.000; • equivalência patrimonial: R$200.000; • venda de ativo imobilizado: R$170.000; • aluguel de imóvel a terceiros: R$120.000. De acordo cm a NBC TG 09 (R1) – DEMONSTRAÇÃO DO VALOR ADICIONADO, na Demonstração do Valor Adicionado da joalheria, em 31/12/2023, o valor adicionado recebido em transferência apresenta o seguinte montante: (A) R$490.000. (B) R$600.000. (C) R$720.000. (D) R$890.000.", "gabarito": "C", "comentario": "Gabarito: C. Comentário: receita aumenta ativos ou reduz passivos, elevando o patrimônio líquido, sem decorrer de contribuição dos sócios. A opção C é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "Uma joalheria reconheceu as seguintes receitas em 2023 com:\n• vendas de mercadorias: R$800.000;\n• financeira: R$400.000;\n• equivalência patrimonial: R$200.000;\n• venda de ativo imobilizado: R$170.000;\n• aluguel de imóvel a terceiros: R$120.000. De acordo cm a NBC TG 09 (R1) – DEMONSTRAÇÃO DO VALOR ADICIONADO, na Demonstração do Valor Adicionado da joalheria, em 31/12/2023, o valor adicionado recebido em transferência apresenta o seguinte montante:\n(A) R$490.000.\n(B) R$600.000.\n(C) R$720.000.\n(D) R$890.000."}, {"prova": "2024.1", "num": 27, "texto": "Uma sociedade empresária apresenta a seus usuários externos as informações sobre a base de preparação das demonstrações financeiras e das práticas contábeis específicas selecionadas e aplicadas para negócios e eventos significativos. Conforme a Lei nº 6.404/76, essa informação deve ser incluída (A) nas Notas Explicativas. (B) no Relatório do Auditor. (C) no Relatório da Administração. (D) na Carta de Responsabilidade da Administração.", "gabarito": "A", "comentario": "Gabarito: A. Comentário: as notas explicativas complementam as demonstrações e detalham bases de elaboração e práticas contábeis relevantes. A opção A é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "Uma sociedade empresária apresenta a seus usuários externos as informações sobre a base de preparação das demonstrações financeiras e das práticas contábeis específicas selecionadas e aplicadas para negócios e eventos significativos. Conforme a Lei nº 6.404/76, essa informação deve ser incluída\n(A) nas Notas Explicativas.\n(B) no Relatório do Auditor.\n(C) no Relatório da Administração.\n(D) na Carta de Responsabilidade da Administração."}, {"prova": "2024.1", "num": 28, "texto": "De acordo com a NBC TG 02 (R3) – EFEITOS DAS MUDANÇAS NAS TAXAS DE CÂMBIO E CONVERSÃO DE DEMONSTRAÇÕES CONTÁBEIS, os elementos do balanço patrimonial podem ser classificados como monetários e não monetários. Assinale a opção que indica um ativo classificado como ativo não monetário em uma papelaria. (A) Estoques. (B) Contas a receber. (C) Aplicações financeiras. (D) Adiantamento de clientes.", "gabarito": "A", "comentario": "Gabarito: A. Comentário: estoques são mensurados pelo menor valor entre o custo e o valor realizável líquido. A opção A é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "De acordo com a NBC TG 02 (R3) – EFEITOS DAS MUDANÇAS NAS TAXAS DE CÂMBIO E CONVERSÃO DE DEMONSTRAÇÕES CONTÁBEIS, os elementos do balanço patrimonial podem ser classificados como monetários e não monetários. Assinale a opção que indica um ativo classificado como ativo não monetário em uma papelaria.\n(A) Estoques.\n(B) Contas a receber.\n(C) Aplicações financeiras.\n(D) Adiantamento de clientes."}, {"prova": "2024.1", "num": 29, "texto": "Conforme a Lei no 6.404/76, no Balanço Patrimonial, as contas do ativo são apresentadas de acordo com a ordem decrescente de grau de (A) liquidez. (B) relevância. (C) objetividade. (D) valor monetário. 8", "gabarito": "A", "comentario": "Gabarito: A. Comentário: itens monetários representam dinheiro ou direito/obrigação de receber ou pagar quantia fixa; estoques e imobilizados são não monetários. A opção A é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "Conforme a Lei no 6.404/76, no Balanço Patrimonial, as contas do ativo são apresentadas de acordo com a ordem decrescente de grau de\n(A) liquidez.\n(B) relevância.\n(C) objetividade.\n(D) valor monetário. 8"}, {"prova": "2024.1", "num": 30, "texto": "Em 2023, a Demonstração do Resultado do Exercício de uma entidade apresentou Receita Líquida de R$200.000 e Lucro Bruto de R$150.000. Pode-se constatar que, na demonstração, a seguinte conta apresenta saldo de R$50.000: (A) despesas de vendas. (B) despesas operacionais. (C) deduções da receita. (D) custo das mercadorias vendidas.", "gabarito": "D", "comentario": "Gabarito: D. Comentário: receita aumenta ativos ou reduz passivos, elevando o patrimônio líquido, sem decorrer de contribuição dos sócios. A opção D é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "Em 2023, a Demonstração do Resultado do Exercício de uma entidade apresentou Receita Líquida de R$200.000 e Lucro Bruto de R$150.000. Pode-se constatar que, na demonstração, a seguinte conta apresenta saldo de R$50.000:\n(A) despesas de vendas.\n(B) despesas operacionais.\n(C) deduções da receita.\n(D) custo das mercadorias vendidas."}, {"prova": "2024.1", "num": 31, "texto": "Uma livraria utiliza o critério PEPS (Primeiro a Entrar, Primeiro a Sair) para mensurar os seus estoques. Em 01/01/2024, havia 20 livros de Contabilidade Avançada em estoque, que foram comprados por R$100 cada. Em 05/01/2024, a livraria adquiriu mais 30 unidades desse mesmo título, por R$120 cada. Já em 10/01/2024, a livraria vendeu 35 exemplares desse livro a um grupo de estudantes, por R$200 cada. De acordo com a NBC TG 16 (R2) – ESTOQUES, o custo das mercadorias vendidas r ração do resultado do exercício."}, {"prova": "2024.1", "num": 33, "texto": "Em abril de 2024, uma empresa de consultoria adquiriu 10 cadeiras para seus funcionários por R$400 cada. Metade do valor foi pago à vista e o restante tem pagamento previsto para junho do mesmo ano. No momento da compra, observam-se as seguintes modificações nos saldos de seus elementos patrimoniais: (A) aumento de R$2.000 no ativo e no passivo. (B) aumento de R$4.000 no ativo e no passivo. (C) aumento de R$4.000 no ativo e no patrimônio líquido. (D) diminuição de R$2.000 no ativo, aumento de R$2.000 no passivo e diminuição de R$4.000 no patrimônio líquido.", "gabarito": "A", "comentario": "Gabarito: A. Comentário: patrimônio líquido é o interesse residual nos ativos depois de deduzidos os passivos. A opção A é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "Em abril de 2024, uma empresa de consultoria adquiriu 10 cadeiras para seus funcionários por R$400 cada. Metade do valor foi pago à vista e o restante tem pagamento previsto para junho do mesmo ano. No momento da compra, observam-se as seguintes modificações nos saldos de seus elementos patrimoniais:\n(A) aumento de R$2.000 no ativo e no passivo.\n(B) aumento de R$4.000 no ativo e no passivo.\n(C) aumento de R$4.000 no ativo e no patrimônio líquido.\n(D) diminuição de R$2.000 no ativo, aumento de R$2.000 no passivo e diminuição de R$4.000 no patrimônio líquido."}, {"prova": "2024.1", "num": 34, "texto": "Uma sociedade empresária oferece serviços de entrega de documentos. Para realizar as entregas, possui cinco motos, sendo que cada uma apresentava, em 31/12/2023, valor contábil de R$30.000. Além disso, a sociedade empresária possui duas motos que são utilizadas exclusivamente para a locomoção de seus diretores. Cada uma dessas motos apresentava, em 31/12/2023, valor contábil de R$50.000. Assinale a opção que indica a apresentação das motos no balanço p ores por empréstimos e outros credores, existentes e potenciais.", "gabarito": "D", "comentario": "Gabarito: D. Comentário: valor justo é preço de saída na venda de ativo ou transferência de passivo em transação ordenada; custos de transação não reduzem o valor justo. A opção D é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "A entidade tem um imóvel para renda avaliada no seu balanço patrimonial pelo valor justo. O valor contábil no início do exercício do ativo é R$1.000. No final do exercício social, considerando o preço por metro quadrado de imóveis semelhantes naquela região, o valor de mercado do imóvel seria R$1.120. Acontece que, caso a entidade vendesse o imóvel, teria que pagar R$50 para um corretor de imóvel. O valor justo desse imóvel na data de encerramento do exercício social deveria ser de\n(A) R$1.070\n(B) R$1.000\n(C) R$1.170\n(D) R$1.120 17 De acordo com o CPC22 - Informações por Segmento, dois ou mais segmentos operacionais podem ser agregados em um único segmento operacional se a agregação for compatível com o princípio básico desta norma, se os segmentos tiverem características econômicas semelhantes e se forem semelhantes em relação a cada um dos seguintes aspectos, à exceção de um. Assinale-o.\n(A) Natureza dos processos de produção ou de distribuição.\n(B) Tipo ou a categoria de clientes dos seus produtos e serviços.\n(C) Resultados em termos absolutos iguais.\n(D) Se aplicável, a natureza do ambiente regulatório. 18 Em relação à estruturação das Normas Brasileiras de Contabilidade Técnicas, analise as afirmações a seguir:\nI. São convergentes com as normas internacionais emitidas pelo International Accounting Standards Board (IASB).\nII. São convergentes com as normas norte-americanas emitidas pelo Financial Accounting Standards Board (FASB).\nIII. São editadas por necessidades locais, sem equivalentes internacionais. De acordo com a Resolução CFC 1.328/11, inale a opção que indica o valor do estoque final de bonecas em 31/01/2024, considerando que a loja utiliza o método do Custo Médio Ponderado Móvel.\n(A) R$376,30.\n(B) R$758,33.\n(C) R$925,00.\n(D) R$945,00. 20"}, {"prova": "2024.1 RS", "num": 21, "texto": "Uma joalheria apresenta, em seu Balanço Patrimonial, três imóveis. O primeiro, onde são realizadas as vendas da loja, é avaliado por R$900.000. O segundo, avaliado por R$700.000, é alugado a terceiros. Já o terceiro, que funciona como escritório e onde acontecem as atividades administrativas, é avaliado por R$500.000. Considerando apenas esses fatos, assinale a opção que indica o saldo do ativo imobilizado da joalheria. (A) R$500.000. (B) R$900.000. (C) R$1.400.000. (D) R$2.100.000.", "gabarito": "C", "comentario": "Gabarito: C. Comentário: ativo imobilizado é bem tangível mantido para uso na produção, prestação de serviços, aluguel a terceiros ou administração, com expectativa de uso por mais de um período. A opção C é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "Uma joalheria apresenta, em seu Balanço Patrimonial, três imóveis. O primeiro, onde são realizadas as vendas da loja, é avaliado por R$900.000. O segundo, avaliado por R$700.000, é alugado a terceiros. Já o terceiro, que funciona como escritório e onde acontecem as atividades administrativas, é avaliado por R$500.000. Considerando apenas esses fatos, assinale a opção que indica o saldo do ativo imobilizado da joalheria.\n(A) R$500.000.\n(B) R$900.000.\n(C) R$1.400.000.\n(D) R$2.100.000."}, {"prova": "2024.1 RS", "num": 22, "texto": "Em 31/12/2023, a Cia Lua apresentava os seguintes saldos em seu ativo: Aplicações financeiras com vencimento em 720 dias: ........................ R$70.000; Clientes com previsão de recebimento em 380 dias: .......................... R$60.000; Disponibilidades: ............................................................................ tizado.", "gabarito": "B", "comentario": "Gabarito: B. Comentário: desreconhecimento ocorre quando o item deixa de atender à definição de ativo ou passivo, normalmente por perda de controle, expiração, consumo, recebimento, execução ou transferência. A opção B é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "De acordo com a NBC TG 26 (R5) – Apresentação das Demonstrações Contábeis, além dos itens requeridos em outras normas, a demonstração do resultado do período deve incluir as rubricas a seguir, com exceção de uma. Assinale-a.\n(A) Custos de financiamento.\n(B) Distribuição do resultado do período.\n(C) Parcela dos resultados de empresas investidas reconhecida por meio do método da equivalência patrimonial.\n(D) Ganhos e perdas decorrentes do desreconhecimento de ativos financeiros mensurados pelo custo amortizado."}, {"prova": "2024.1 RS", "num": 24, "texto": "Leia o fragmento a seguir: Resultado abrangente é a mutação que ocorre no _____ durante um período que resulta de transações e outros eventos que não sejam derivados de transações com os sócios na sua qualidade de proprietários. Assinale a opção que completa corretamente a lacuna do fragmento. (A) ativo (B) passivo (C) resultado (D) patrimônio líquido", "gabarito": "D", "comentario": "Gabarito: D. Comentário: patrimônio líquido é o interesse residual nos ativos depois de deduzidos os passivos. A opção D é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "Leia o fragmento a seguir: Resultado abrangente é a mutação que ocorre no _____ durante um período que resulta de transações e outros eventos que não sejam derivados de transações com os sócios na sua qualidade de proprietários. Assinale a opção que completa corretamente a lacuna do fragmento.\n(A) ativo\n(B) passivo\n(C) resultado\n(D) patrimônio líquido"}, {"prova": "2024.1 RS", "num": 2 , classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "A NBC TG 25 – PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES ilustra o tratamento contábil quando uma obrigação presente ou possível da entidade envolve prazos ou valores incertos. Com base na referida norma, relacione o tratamento dado a cada situação a seguir com seu reconhecimento e divulgação.\nI. Há obrigação presente que provavelmente requer uma saída de recursos.\nII. Há obrigação possível ou obrigação presente que pode requerer, mas provavelmente não irá requerer, uma saída de recursos.\nIII. Há obrigação possível ou obrigação presente cuja probabilidade de uma saída de recursos é remota. ( ) Não é reconhecida nenhuma provisão e não há obrigatoriedade de divulgação. ( ) Deve-se reconhecer a provisão e divulgar em nota explicativa. ( ) Não é reconhecida a provisão, mas é divulgado o fato em nota explicativa como passivo contingente. A relação correta, na ordem apresentada, é\n(A) III – I –\nII. (B) III – II –\nI. (C) II – I –\nIII. (D) I – III – II."}, {"prova": "2024.2", "num": 20, "texto": "Uma sociedade empresária pode elaborar sua Demonstração dos Fluxos de Caixa de acordo com o método direto ou com o método indireto. De acordo com a NBC TG 03 (R3) – DEMONSTRAÇÃO DOS FLUXOS DE CAIXA, a diferença entre as duas demonstrações elaboradas consiste somente na apresentação (A) da atividade operacional. (B) da atividade de investimento. (C) da atividade de financiamento. (D) do caixa e equivalentes de caixa.", "gabarito": "A", "comentario": "Gabarito: A. Comentário: na DFC, compra ou venda de imobilizado é atividade de investimento; recebimentos e pagamentos ligados à atividade principal são operacionais. A opção A é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "Uma sociedade empresária pode elaborar sua Demonstração dos Fluxos de Caixa de acordo com o método direto ou com o método indireto. De acordo com a NBC TG 03 (R3) – DEMONSTRAÇÃO DOS FLUXOS DE CAIXA, a diferença entre as duas demonstrações elaboradas consiste somente na apresentação\n(A) da atividade operacional.\n(B) da atividade de investimento.\n(C) da atividade de financiamento.\n(D) do caixa e equivalentes de caixa."}, {"prova": "2024.2", "num": 21, "texto": "Em 01/06/2024, uma joalheria adquiriu 40 anéis pelo valor unitário de R$ 800. O frete para a entrega e o seguro do transporte foram, respectivamente, de R$ 500 e R$ 1.600. Os valores foram pagos à vista pela joalheria. O custo do estoque no balanço patrimonial da joalheria, antes do início das vendas, é de (A) R$ 32.000. (B) R$ 32.500. (C) R$ 33.600. (D) R$ 34.100.", "gabarito": "D", "comentario": "Gabarito: D. Comentário: estoques são mensurados pelo menor valor entre o custo e o valor realizável líquido. A opção D é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "Em 01/06/2024, uma joalheria adquiriu 40 anéis pelo valor unitário de R$ 800. O frete para a entrega e o seguro do transporte foram, respectivamente, de R$ 500 e R$ 1.600. Os valores foram pagos à vista pela joalheria. O custo do estoque no balanço patrimonial da joalheria, antes do início das vendas, é de\n(A) R$ 32.000.\n(B) R$ 32.500.\n(C) R$ 33.600.\n(D) R$ 34.100."}, {"prova": "2024.2", "num": 22, "texto": "Em 01/05/2022, uma loja de roupas pagou R$ 180.000 a terceiros, referentes ao aluguel antecipado de 3 anos do imóvel onde funcionava a sua loja, contados a partir da data de pagamento. Em 31/12/2023, a despesa antecipada de aluguel no ativo realizável a longo prazo da loja era (A) zero. (B) R$ 20.000. (C) R$ 60.000. (D) R$ 80.000. 34", "gabarito": "B", "comentario": "Gabarito: B. Comentário: a alternativa correta decorre da aplicação direta da norma contábil mencionada no enunciado e da identificação do fato contábil predominante. A opção B é a que respeita esse tratamento; as demais con ente."}, {"prova": "2025.1", "num": 19, "texto": "De acordo com a NBC TG 09 (R1) - DEMONSTRAÇÃO DO VALOR ADICIONADO, a referida Demonstração (DVA) está relacionada com informações econômicas e com a comunicação de elementos ambientais, sociais e de governança (ASG), e tem por finalidade evidenciar a riqueza criada pela entidade e sua distribuição, durante determinado período. Nesse sentido, considerando que a sociedade empresária “B” possui reversão de perdas estimadas com créditos de liquidação duvidosa, essa informação deve ser apresentada, em sua DVA, do seguinte modo: (A) em remuneração de capitais próprios, na segunda parte da DVA. (B) em remuneração de capitais de terceiros, na segunda parte da DVA. (C) em valor adicionado recebido em transferência, na primeira parte da DVA. (D) em riqueza criada pela própria entidade, na primeira parte da DVA.", "gabarito": "D", "comentario": "Gabarito: D. Comentário: na DVA, valor adicionado recebido em transferência inclui receitas financeiras, resultado de equivalência patrimonial e outras transferências recebidas. A opção D é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "De acordo com a NBC TG 09 (R1) - DEMONSTRAÇÃO DO VALOR ADICIONADO, a referida Demonstração (DVA) está relacionada com informações econômicas e com a comunicação de elementos ambientais, sociais e de governança (ASG), e tem por finalidade evidenciar a riqueza criada pela entidade e sua distribuição, durante determinado período. Nesse sentido, considerando que a sociedade empresária “B” possui reversão de perdas estimadas com créditos de liquidação duvidosa, essa informação deve ser apresentada, em sua DVA, do seguinte modo:\n(A) em remuneração de capitais próprios, na segunda parte da DVA.\n(B) em remuneração de capitais de terceiros, na segunda parte da DVA.\n(C) em valor adicionado recebido em transferência, na primeira parte da DVA.\n(D) em riqueza criada pela própria entidade, na primeira parte da DVA."}, {"prova": "2025.1", "num": 20, "texto": "A Demonstração do Valor Adicionado proporciona aos usuários das demonstrações contábeis informações relativas à riqueza criada pela entidade em determinado período e à forma como tais riquezas foram distribuídas. Na distribuição do valor adicionado, o total de “Remuneração de capitais próprios” deve ser igual (A) às reservas de lucro reportadas no Balanço Patrimonial. (B) ao pagamento de dividendos reportado na Demonstração dos Fluxos de Caixa. (C) ao resultado líquido do exercício reportado na Demonstração do Resultado do Período. (D) à distribuição de dividendos reportada na Demonstração das Mutações do Patrimônio Líquido. 49", "gabarito": "C", "comentario": "Gabarito: C. Comentário: na DFC, compra ou venda de imobilizado é atividade de investimento; recebimentos e pagamentos ligados à atividade principal são operacionais. A opção C é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "A Demonstração do Valor Adicionado proporciona aos usuários das demonstrações contábeis informações relativas à riqueza criada pela entidade em determinado período e à forma como tais riquezas foram distribuídas. Na distribuição do valor adicionado, o total de “Remuneração de capitais próprios” deve ser igual\n(A) às reservas de lucro reportadas no Balanço Patrimonial.\n(B) ao pagamento de dividendos reportado na Demonstração dos Fluxos de Caixa.\n(C) ao resultado líquido do exercício reportado na Demonstração do Resultado do Período.\n(D) à distribuição de dividendos reportada na Demonstração das Mutações do Patrimônio Líquido. 49"}, {"prova": "2025.1", "num": 21, "texto": "Uma loja que vende produtos de escritório apresentava os seguintes saldos em 31/12/2023: • Custo da mercadoria vendida (inclui os valores dos impostos recuperáveis): R$ 80.000,00 • Despesa de depreciação dos ativos imobilizados: R$ 15.000,00 • Perdas uando os ativos líquidos finais superam os iniciais, excluídas contribuições e distribuições aos sócios. A opção B é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "A NBC TG 28 (R4) - PROPRIEDADES PARA INVESTIMENTO trata de definição, classificação e mensuração de propriedades para investimento. Sobre esse item, analise as seguintes afirmativas:\nI. Propriedade para Investimento é classificada dentro do subgrupo investimento no ativo circulante.\nII. Propriedade para investimento é um terreno, edifício ou veículo mantido pela entidade para auferir aluguel ou valorização do capital.\nIII. Propriedade para investimento no momento da aquisição deve ser mensurada pelo seu custo. Está correto o que se afirma em\n(A) II e III, apenas.\n(B) III, apenas.\n(C) I, II e\nIII. (D) II, apenas."}, {"prova": "2025.2", "num": 15, "texto": "Um ativo individual ou um grupo de ativos mantido para venda são ativos a ser alienados, por venda ou de outra forma, em conjunto como um grupo de ativos em uma só transação, e passivos diretamente associados a esses ativos que serão transferidos na transação. De acordo com a NBC TG 31 (R4) - ATIVO NÃO CIRCULANTE MANTIDO PARA VENDA E OPERAÇÃO DESCONTINUADA, a depreciação do ativo ou grupo de ativos mantidos para venda deve (A) ser parcial, pois o ativo ou grupo de ativos ainda está operando. (B) ser mantida até a venda ser concretizada. (C) ser interrompida quando o ativo ou grupo de ativos for reclassificado como mantido para venda. (D) continuar como estava antes da reclassificação. 64", "gabarito": "C", "comentario": "Gabarito: C. Comentário: depreciação aloca o valor depreciável ao longo da vida útil; mudança de estimativa é aplicada prospectivamente. A opção C é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "Um ativo individual ou um grupo de ativos mantido para venda são ativos a ser alienados, por venda ou de outra forma, em conjunto como um grupo de ativos em uma só transação, e passivos diretamente associados a esses ativos que serão transferidos na transação. De acordo com a NBC TG 31 (R4) - ATIVO NÃO CIRCULANTE MANTIDO PARA VENDA E OPERAÇÃO DESCONTINUADA, a depreciação do ativo ou grupo de ativos mantidos para venda deve\n(A) ser parcial, pois o ativo ou grupo de ativos ainda está operando.\n(B) ser mantida até a venda ser concretizada.\n(C) ser interrompida quando o ativo ou grupo de ativos for reclassificado como mantido para venda.\n(D) continuar como estava antes da reclassificação. 64"}, {"prova": "2025.2", "num": 16, "texto": "De acordo com a NBC TG 01 (R4) - REDUÇÃO AO VALOR RECUPERÁVEL DE ATIVOS, o valor em uso é o valor presente de fluxos de caixa futuros esperados que devem advir de um ativo ou de unidade geradora de caixa. Avalie se os seguintes elementos devem ser refletidos no cálculo do valor em uso do ativo: I. O valor pago na aquisição do ativo. II. As expectativas acerca de possíveis variações no montante ou no período de ocorrência desses fluxos de caixa futuros. III. As estimativas dos fluxos de caixa futuros que a entidade espera obter com esse ativo. IV. O valor do dinheiro no tempo, representado pela atual taxa de juros livre de risco. Estão corretos os elementos (A) I, II e III, apenas. (B) I e II, apenas. (C) III e IV, apenas. (D) II, III e IV, apenas.", "gabarito": "D", "comentario": "Gabarito: D. Comentário: a alternativa correta decorre da aplicação direta da norma contábil mencionada no enunciado e da identificação do fato contábil predominante. A opção D é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "De acordo com a NBC TG 01 (R4) - REDUÇÃO AO VALOR RECUPERÁVEL DE ATIVOS, o valor em uso é o valor presente de fluxos de caixa futuros esperados que devem advir de um ativo ou de unidade geradora de caixa. Avalie se os seguintes elementos devem ser refletidos no cálculo do valor em uso do ativo:\nI. O valor pago na aquisição do ativo.\nII. As expectativas acerca de possíveis variações no montante ou no período de ocorrência desses fluxos de caixa futuros.\nIII. As estimativas dos fluxos de caixa futuros que a entidade espera obter com esse ativo.\nIV. O valor do dinheiro no tempo, representado pela atual taxa de juros livre de risco. Estão corretos os elementos\n(A) I, II e III, apenas.\n(B) I e II, apenas.\n(C) III e IV, apenas.\n(D) II, III e IV, apenas."}, {"prova": "2025.2", "num": 17, "texto": "O ágio por expectativa de rentabilidade futura (goodwill) reconhecido em uma combinação de negócios é um ativo que representa benefícios econômicos futuros advindos de outros ativos adquiridos na combinação de negócios que não são identificados individualmente e não são reconhecidos separadamente. De acordo com a NBC TG 04 (R4) - ATIVO INTANGÍVEL e com a NBC TG 15 (R4) - COMBINAÇÃO DE NEGÓCIOS, a empresa adquirente deve reconhecer, na data da aquisição, separadamente do ágio derivado da expectativa de rentabilidade futura (goodwill) apurado em uma combinação de negócios, um ativo intangível da adquirida, independentemente de o ativo ter sido reconhecido pela adquirida antes da aquisição da empresa. A perda por desvalorização reconhecida para o ágio por expectativa de rentabilidade futura (goodwill) não deve ser revertida em período subsequente, pois (A) não pode ser amortizada. (B) no plano de contas não há rubrica apropriada. (C) gera fluxos de caixa, independentemente de outros ativos ou grupos de ativos. (D) é equivalente ao goodwill gerado internamente.", "gabarito": "D", "comentario": "Gabarito: D. Comentário: gastos de pesquisa, treinamento, publicidade e pré-operacionais tendem a ser despesa; desenvolvimento só pode ser ativado se atender aos critérios da norma. A opção D é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "O ágio por expectativa de rentabilidade futura (goodwill) reconhecido em uma combinação de negócios é um ativo que representa benefícios econômicos futuros advindos de outros ativos adquiridos na combinação de negócios que não são identificados individualmente e não são reconhecidos separadamente. De acordo com a NBC TG 04 (R4) - ATIVO INTANGÍVEL e com a NBC TG 15 (R4) - COMBINAÇÃO DE NEGÓCIOS, a empresa adquirente deve reconhecer, na data da aquisição, separadamente do ágio derivado da expectativa de rentabilidade futura (goodwill) apurado em uma combinação de negócios, um ativo intangível da adquirida, independentemente de o ativo ter sido reconhecido pela adquirida antes da aquisição da empresa. A perda por desvalorização reconhecida para o ágio por expectativa de rentabilidade futura (goodwill) não deve ser revertida em período subsequente, pois\n(A) não pode ser amortizada.\n(B) no plano de contas não há rubrica apropriada.\n(C) gera fluxos de caixa, independentemente de outros ativos ou grupos de ativos.\n(D) é equivalente ao goodwill gerado internamente."}, {"prova": "2025.2", "num": 18, "texto": "A Demonstração do Valor Adicionado (DVA) busca evidenciar o valor e a distribuição da riqueza econômica gerada pelas atividades da sociedade empresária, incluindo também o valor adicionado recebido em transferência. A riqueza gerada é evidenciada na distribuição entre o capital (Remuneração de capital próprio e de terceiros), trabalho (Pessoal) e governo (Impostos, taxas e contribuições). Relacione cada item a seguir ao respectivo componente da distribuição da riqueza, conforme disposto na NBC TG 09 (R1) - DEMONSTRAÇÃO DO VALOR ADICIONADO. ( ) Fundo de Garantia por Tempo de Serviços (FGTS) ( ) Aluguéis pagos ( ) Dividendos distribuídos ( ) Contribuição Social sobre o Lucro Líquido (CSLL) 1. Pessoal 2. Impostos, taxas e contribuições 3. Remuneração de capital de terceiros 4. Remuneração de capital próprio A relação correta, na ordem ap va": "2026.1", "num": 14, "texto": "Uma empresa S.A. atua no setor de bebidas e possui diversas unidades de negócios. Entre elas, destacam-se as operações de “Cervejas” e “Refrigerantes”. A administração da companhia utiliza regularmente informações de desempenho dessas unidades para fins de avaliação de resultados e alocação de recursos, sendo tais informações analisadas pelo principal responsável pela tomada de decisões operacionais da entidade (CODM – Chief Operating Decision Maker). A empresa avaliou os seguintes indicadores referentes ao exercício: • A unidade Cervejas representa 12% da receita combinada de todos os segmentos operacionais. • A unidade Refrigerantes possui 9% da receita combinada, mas 11% dos ativos combinados dos segmentos operacionais. • Ambas as unidades têm suas informações regularmente revisadas pelo principal responsável pela tomada de decisões operacionais. Considerando as informações apresentadas e os preceitos da NBC TG 22 (R2) – INFORMAÇÕES POR SEGMENTO, é correto afirmar que (A) apenas o segmento Cervejas deve ser divulgado separadamente, pois somente ele ultrapassa o limite de 10% da receita combinada dos segmentos operacionais. (B) apenas o segmento Refrigerantes, deve ser divulgado separadamente, pois o critério de ativos é suficiente para caracterizar segmento reportável. (C) ambos os segmentos devem ser divulgados separadamente, pois cada um atende a, pelo menos, um dos critérios quantitativos previstos para segmentação reportável. (D) nenhum dos segmentos deve ser divulgado separadamente, pois é necessário que o segmento atenda simultaneamente aos critérios de receita, resultado e ativos.", "gabarito": "C", "comentario": "Gabarito: C. Comentário: receita aumenta ativos ou reduz passivos, elevando o patrimônio líquido, sem decorrer de contribuição dos sócios. A opção C é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "Uma empresa S.A. atua no setor de bebidas e possui diversas unidades de negócios. Entre elas, destacam-se as operações de “Cervejas” e “Refrigerantes”. A administração da companhia utiliza regularmente informações de desempenho dessas unidades para fins de avaliação de resultados e alocação de recursos, sendo tais informações analisadas pelo principal responsável pela tomada de decisões operacionais da entidade (CODM – Chief Operating Decision Maker). A empresa avaliou os seguintes indicadores referentes ao exercício:\n• A unidade Cervejas representa 12% da receita combinada de todos os segmentos operacionais.\n• A unidade Refrigerantes possui 9% da receita combinada, mas 11% dos ativos combinados dos segmentos operacionais.\n• Ambas as unidades têm suas informações regularmente revisadas pelo principal responsável pela tomada de decisões operacionais. Considerando as informações apresentadas e os preceitos da NBC TG 22 (R2) – INFORMAÇÕES POR SEGMENTO, é correto afirmar que\n(A) apenas o segmento Cervejas deve ser divulgado separadamente, pois somente ele ultrapassa o limite de 10% da receita combinada dos segmentos operacionais.\n(B) apenas o segmento Refrigerantes, deve ser divulgado separadamente, pois o critério de ativos é suficiente para caracterizar segmento reportável.\n(C) ambos os segmentos devem ser divulgados separadamente, pois cada um atende a, pelo menos, um dos critérios quantitativos previstos para segmentação reportável.\n(D) nenhum dos segmentos deve ser divulgado separadamente, pois é necessário que o segmento atenda simultaneamente aos critérios de receita, resultado e ativos."}, {"prova": "2026.1", "num": 15, "texto": "Uma empresa S.A. apresentou, em 31/12/2025, ativos fiscais diferidos decorrentes de prejuízos fiscais, bases negativas de contribuição social e diferenças temporárias dedutíveis, totalizando R$ 6.669.000,00 nas demonstrações individuais e R$ 7.121.000,00 nas demonstrações consolidadas. Conforme divulgado em nota explicativa, a realização desses ativos depende da geração futura de lucros tributáveis suficientes para permitir a compensação dos prejuízos fiscais e das bases negativas, bem como da reversão das diferenças temporárias dedutíveis. A administração elaborou projeções de resultados tributáveis futuros que suportam o reconhecimento desses ativos fiscais diferidos. O auditor independente incluiu, em seu relatório, parágrafo chamando a atenção para a nota explicativa, destacando a existência de incerteza relacionada ao prazo de realização dos ativos fiscais diferidos, mas afirmando que sua opinião não está ressalvada em relação a esse assunto. Considerando as informações apresentadas e os preceitos da NBC TG 32 (R4) – TRIBUTOS SOBRE O LUCRO, conclui-se que (A) a existência de prejuízos fiscais acumulados impede o reconhecimento de ativos fiscais diferidos, devendo tais valores ser reconhecidos somente quando ocorrer efetivamente lucro tributável suficiente para sua compensação. (B) a entidade deve reconhecer ativo fiscal diferido decorrente de prejuízos fiscais, somente quando for provável a existência de lucro tributável futuro suficiente para sua compensação. (C) os ativos fiscais diferidos decorrentes de prejuízos fiscais podem ser reconhecidos com base em estimativas de lucros tributáveis futuros elaboradas pela administração, independente da avaliação de probabilidade de realização. (D) a inclusão de parágrafo, chamando a atenção no relatório do auditor, indica discordância quanto ao reconhecimento do ativo fiscal diferido e implica modificação na opinião de auditoria. 81", "gabarito": "B", "comentario": "Gabarito: B. Comentário: nas demonstrações consolidadas, controladora e controladas são apresentadas como uma única entidade econômica. A opção B é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "Uma empresa S.A. apresentou, em 31/12/2025, ativos fiscais diferidos decorrentes de prejuízos fiscais, bases negativas de contribuição social e diferenças temporárias dedutíveis, totalizando R$ 6.669.000,00 nas demonstrações individuais e R$ 7.121.000,00 nas demonstrações consolidadas. Conforme divulgado em nota explicativa, a realização desses ativos depende da geração futura de lucros tributáveis suficientes para permitir a compensação dos prejuízos fiscais e das bases negativas, bem como da reversão das diferenças temporárias dedutíveis. A administração elaborou projeções de resultados tributáveis futuros que suportam o reconhecimento desses ativos fiscais diferidos. O auditor independente incluiu, em seu relatório, parágrafo chamando a atenção para a nota explicativa, destacando a existência de incerteza relacionada ao prazo de realização dos ativos fiscais diferidos, mas afirmando que sua opinião não está ressalvada em relação a esse assunto. Considerando as informações apresentadas e os preceitos da NBC TG 32 (R4) – TRIBUTOS SOBRE O LUCRO, conclui-se que\n(A) a existência de prejuízos fiscais acumulados impede o reconhecimento de ativos fiscais diferidos, devendo tais valores ser reconhecidos somente quando ocorrer efetivamente lucro tributável suficiente para sua compensação.\n(B) a entidade deve reconhecer ativo fiscal diferido decorrente de prejuízos fiscais, somente quando for provável a existência de lucro tributável futuro suficiente para sua compensação.\n(C) os ativos fiscais diferidos decorrentes de prejuízos fiscais podem ser reconhecidos com base em estimativas de lucros tributáveis futuros elaboradas pela administração, independente da avaliação de probabilidade de realização.\n(D) a inclusão de parágrafo, chamando a atenção no relatório do auditor, indica discordância quanto ao reconhecimento do ativo fiscal diferido e implica modificação na opinião de auditoria. 81"}, {"prova": "2026.1", "num": 16, "texto": "Uma companhia aberta brasileira atua no comércio varejista de bens de consumo por meio de lojas físicas e de plataforma digital. Em suas vendas on-line, a entidade também realiza o transporte das mercadorias por meio de logística própria. Em determinado dia, um cliente adquiriu um livro por meio do website da companhia. O pagamento foi realizado instantaneamente via PIX, e a nota fiscal eletrônica foi imediatamente emitida e enviada ao cliente por e-mail. O livro foi separado no centro de distribuição da empresa e despachado em caminhão pertencente à própria companhia, responsável pela entrega ao consumidor final. Durante o trajeto, antes da entrega ao cliente, o caminhão sofreu um acidente e parte das mercadorias transportadas foi completamente destruída, incluindo o livro adquirido pelo cliente. Considerando-se as informações apresentadas e os preceitos da NBC TG 47 – RECEITA DE CONTRATO COM CLIENTE, a receita deve ser reconhecida (A) quando o pagamento via PIX foi realizado, pois a contraprestação foi recebida e a nota fiscal emitida; a perda do livro deve ser reconhecida pelo cliente, que já havia quitado a compra. (B) no momento do despacho da mercadoria pelo centro de distribuição, pois a empresa já cumpriu sua obrigação principal; a perda decorrente do acidente deve ser reconhecida pelo cliente. (C) quando o livro for efetivamente entregue ao cliente, momento em que ocorre a transferência de controle do bem; como o acidente ocorreu antes da entrega, a perda do livro deve ser reconhecida pela própria companhia. (D) no momento da emissão da nota fiscal eletrônica, pois esse ato caracteriza a transferência jurídica do bem; a perda decorrente do acidente deve ser reconhecida como despesa operacional do cliente.", "gabarito": "C", "comentario": "Gabarito: C. Comentário: receita aumenta ativos ou reduz passivos, elevando o patrimônio líquido, sem decorrer de contribuição dos sócios. A opção C é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "Uma companhia aberta brasileira atua no comércio varejista de bens de consumo por meio de lojas físicas ecimento do mesmo bem.\n(D) A depreciação do ativo de direito de uso na arrendatária ABC tem como contrapartida o passivo de arrendamento reconhecido junto à XYZ."}, {"prova": "2026.1", "num": 18, "texto": "Em 2023, uma empresa de consultoria contábil pagou R$ 20.000,00 a título de juros sobre empréstimo bancário. De acordo com a NBC TG 03 (R3) – DEMONSTRAÇÃO DOS FLUXOS DE CAIXA, os juros pagos podem ser classificados, na Demonstração dos Fluxos de Caixa, como fluxos de caixa (A) operacionais ou de investimento. (B) operacionais ou de financiamento. (C) de investimento ou de financiamento. (D) de financiamento ou de equivalentes de caixa.", "gabarito": "B", "comentario": "Gabarito: B. Comentário: na DFC, compra ou venda de imobilizado é atividade de investimento; recebimentos e pagamentos ligados à atividade principal são operacionais. A opção B é a que respeita esse tratamento; as demais confundem conceito, classificação, momento de reconhecimento ou mensuração.", "texto_fmt": "Em 2023, uma empresa de consultoria contábil pagou R$ 20.000,00 a título de juros sobre empréstimo bancário. De acordo com a NBC TG 03 (R3) – DEMONSTRAÇÃO DOS FLUXOS DE CAIXA, os juros pagos podem ser classificados, na Demonstração dos Fluxos de Caixa, como fluxos de caixa\n(A) operacionais ou de investimento.\n(B) operacionais ou de financiamento.\n(C) de investimento ou de financiamento.\n(D) de financiamento ou de equivalentes de caixa."}, {"prova": "2026.1", "num": 19, "texto": "Na geração interna de um ativo intangível por uma sociedade empresária, foram gastos R$ 10.000,00 com atividades destinadas à obtenção de novo conhecimento, R$ 15.000,00 com formulação, projeto, avaliação e seleção final de alternativas possíveis para materiais e processos, e R$ 20.000,00 com o projeto, construção e teste de protótipos e modelos pré-produção. Sabe-se que estavam presentes todos os requisitos dispostos na NBC TG 04 (R4) – ATIVO INTANGÍVEL, para o reconhecimento dos gastos incorridos na fase de des function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.getElementById('nav').classList.toggle('hidden',id==='start'||id==='end');}
function startApp(){aluno=document.getElementById('nome').value.trim(); if(!aluno){alert('Digite o nome do aluno.');return} localStorage.setItem('pm_aluno_cfc',aluno); const msg=encodeURIComponent('Professor Moreira, meu nome é '+aluno+' e estou iniciando a trilha de questões CFC 11 a 36 comentadas.'); window.open('https://wa.me/5561985323574?text='+msg,'_blank'); idx=Number(localStorage.getItem('pm_idx_cfc')||0); mode=localStorage.getItem('pm_mode_cfc')||'q'; render();}
function render(){localStorage.setItem('pm_idx_cfc',idx);localStorage.setItem('pm_mode_cfc',mode); const p=Math.round(((idx+(mode==='r'?0.5:0))/total)*100); document.getElementById('prog').style.width=p+'%'; const it=DATA[idx]; if(mode==='q'){show('quiz'); document.getElementById('badge').textContent=it.prova+' • Questão '+it.num+' • '+(idx+1)+'/'+total; document.getElementById('titulo').textContent='Leia e marque mentalmente a resposta'; document.getElementById('qtext').textContent=it.texto_fmt; const opts=document.getElementById('opts'); opts.innerHTML=''; ['A','B','C','D'].forEach(l=>{let b=document.createElement('button'); b.className='select '+(marked[idx]===l?'on':''); b.textContent='Marcar alternativa '+l; b.onclick=()=>{marked[idx]=l; render();}; opts.appendChild(b);})} else {show('review'); document.getElementById('rbadge').textContent=it.prova+' • Questão '+it.num+' • Comentário'; document.getElementById('rtitulo').textContent='Resposta comentada'; document.getElementById('ans').textContent='Gabarito: '+it.gabarito; document.getElementById('comm').textContent=it.comentario;}}
function next(){if(mode==='q') mode='r'; else {idx++; mode='q'; if(idx>=total) return finish();} render();}
function prev(){if(mode==='r') mode='q'; else if(idx>0){idx--; mode='r';} render();}
function finish(){show('end'); document.getElementById('prog').style.width='100%'; document.getElementById('finaltxt').textContent='Aluno: '+aluno+' concluiu '+total+' questões comentadas.'; const g=document.getElementById('grid'); g.innerHTML=''; DATA.forEach((it,i)=>{let d=document.createElement('div'); d.className='chip'; d.textContent=it.prova.replace('20','')+'-'+it.num; g.appendChild(d);})}
function sendResult(){const msg=encodeURIComponent('Professor Moreira, eu '+aluno+' concluí a trilha mobile comentada das questões 11 a 36 das provas CFC. Total: '+total+' questões.'); window.open('https://wa.me/5561985323574?text='+msg,'_blank');}
function restart(){idx=0;mode='q';marked={};localStorage.removeItem('pm_idx_cfc');localStorage.removeItem('pm_mode_cfc');render();}
window.onload=()=>{const n=localStorage.getItem('pm_aluno_cfc'); if(n) document.getElementById('nome').value=n;}
</script></body></html>
